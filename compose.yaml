services:
  api:
    build:
      context: ./backend
    image: shiftmate-api:dev
    container_name: shiftmate-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: shiftmate-db
    environment:
      POSTGRES_DB: shiftmate
      POSTGRES_USER: shiftmate
      POSTGRES_PASSWORD: shiftmate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftmate -d shiftmate"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  uploads:
